<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Reading · Phaidei Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <div id="progress"></div>

  <header class="bar" id="bar">
    <a class="back" href="index.html">← Archive</a>
    <div class="who"><span id="barTitle"></span></div>
    <div class="tools">
      <select id="chapterSelect" aria-label="Jump to chapter"></select>
      <button id="smaller" aria-label="Smaller text">A−</button>
      <button id="bigger" aria-label="Bigger text">A+</button>
      <button id="theme" aria-label="Switch theme">Paper</button>
    </div>
  </header>

  <main class="page">
    <section class="square hero" id="hero" hidden></section>
    <section class="square" id="summarySquare" hidden></section>
    <section class="square" id="notesSquare" hidden></section>
   

    <div class="meander" id="storyStart" aria-hidden="true" hidden></div>

    <article id="text"></article>

    <footer class="theend" id="theEnd" hidden></footer>
  </main>

  <script src="reader.js"></script>
</body>
</html>
